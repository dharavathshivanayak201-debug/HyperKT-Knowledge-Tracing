name: Publish reviewed model assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-reviewed-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source and manifest
        uses: actions/checkout@v4
      - name: Fetch temporary same-repository model transport
        uses: actions/checkout@v4
        with:
          ref: release-asset-transfer-v1
          path: release-transport
          fetch-depth: 1
      - name: Verify archive sizes, hashes and every original model entry
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path(".")
          manifest = json.loads((root / "provenance/checkpoint-release-manifest.json").read_text())
          folder = root / "release-transport"
          expected = {r["asset"] for r in manifest["assets"]} | {"SHA256SUMS.txt", ".git"}
          assert {p.name for p in folder.iterdir()} == expected
          for row in manifest["assets"]:
              path = folder / row["asset"]
              assert path.stat().st_size == row["bytes"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == row["sha256"]
              entries = {r["entry"]: r for r in manifest["checkpoints"] if r["asset"] == row["asset"]}
              with zipfile.ZipFile(path) as archive:
                  assert set(archive.namelist()) == set(entries)
                  assert archive.testzip() is None
                  for name, entry in entries.items():
                      data = archive.read(name)
                      assert len(data) == entry["bytes"]
                      assert hashlib.sha256(data).hexdigest() == entry["sha256"]
              print(row["asset"], len(entries), digest)
          PY
          cd release-transport
          sha256sum -c SHA256SUMS.txt
      - name: Upload verified model-only assets and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload v1.0.0 \
            release-transport/hyperkt-final-stage9e-checkpoints-v1.zip \
            release-transport/hyperkt-historical-stage4-to8a-checkpoints-v1.zip \
            release-transport/hyperkt-historical-stage8b-checkpoints-v1.zip \
            release-transport/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY"
          gh release edit v1.0.0 --draft=false --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY"
      - name: Verify published asset count and native GitHub SHA-256 digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets,url > release-published.json
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path(".")
          published = json.loads((root / "release-published.json").read_text())
          manifest = json.loads((root / "provenance/checkpoint-release-manifest.json").read_text())
          assert not published["isDraft"]
          assets = {r["name"]: r for r in published["assets"]}
          assert set(assets) == {r["asset"] for r in manifest["assets"]} | {"SHA256SUMS.txt"}
          for row in manifest["assets"]:
              asset = assets[row["asset"]]
              assert asset["size"] == row["bytes"]
              assert asset["digest"] == "sha256:" + row["sha256"]
          print("Published verified assets:", published["url"])
          PY
